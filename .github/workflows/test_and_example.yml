name: Run Selected Tests and Examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-tests-and-examples:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install the package from setup.py
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install external_packages/osmread
          pip install external_packages/gtfspy

      - name: run unit tests
        run: |
          ls .
          pwd
          ls gtfs_railways/tests
          pytest -v gtfs_railways/tests/test_config.py

      - name: run examples
        run: |
          python -c gtfs_railways/gtfs_railways/examples/example_01.py
          python -c gtfs_railways/gtfs_railways/examples/example_02.py
          python -c gtfs_railways/gtfs_railways/examples/example_03.py
          python -c gtfs_railways/gtfs_railways/examples/example_04.py
          python -c gtfs_railways/gtfs_railways/examples/example_05.py
